<style>
/* Layout: one full-bleed generative chart of Portsmouth Harbour; the name sits low-left like a chart cartouche. */
:root {
  --midnight: #070f26;
  --abyss: #030817;
  --patina: #6fa898;
  --bronze: #b98d55;
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.72);
  --ink-faint: rgba(255, 255, 255, 0.42);
  --font-display: "Bodoni Moda", "Didot", "Bodoni 72", "Times New Roman", serif;
  --font-utility: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter: clamp(20px, 6vw, 88px);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(120% 90% at 60% 40%, #0b1a3c 0%, var(--midnight) 55%, var(--abyss) 100%);
  color: var(--ink);
  font-family: var(--font-utility);
  -webkit-font-smoothing: antialiased;
}
#tide {
  opacity: 0;
  transition: opacity 1.2s ease;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#tide.on { opacity: 1; }
.veil {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 60% at 0% 100%, rgba(3, 8, 23, 0.86) 0%, rgba(3, 8, 23, 0.5) 45%, rgba(3, 8, 23, 0) 75%),
    linear-gradient(to top, rgba(3, 8, 23, 0.55), rgba(3, 8, 23, 0) 38%);
}
.mark {
  position: fixed;
  left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
  right: var(--gutter);
  bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: clamp(18px, 2.6vw, 30px);
  max-width: 40rem;
  animation: surface 2.2s cubic-bezier(.2, .7, .2, 1) 0.4s both;
}
.coords {
  margin: 0;
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.7rem, 8.4vw, 6.6rem);
  line-height: 0.92;
  letter-spacing: -0.015em;
  text-wrap: balance;
  font-optical-sizing: auto;
}
h1 .ltd {
  font-style: italic;
  font-size: 0.42em;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  margin-left: 0.18em;
  white-space: nowrap;
}
.contact {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px 22px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.9em;
  padding: 0.95em 1.5em;
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 999px;
  color: var(--ink);
  text-decoration: none;
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  background: rgba(3, 8, 23, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background-color .35s ease, color .35s ease, border-color .35s ease;
}
.btn svg { width: 1.1em; height: 1.1em; transition: transform .35s ease; }
.btn:hover { background: var(--ink); color: var(--midnight); border-color: var(--ink); }
.btn:hover svg { transform: translateX(3px); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.addr {
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  user-select: all;
}
.credit {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  margin: 0;
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.3);
}
.credit a { color: inherit; }
@keyframes surface {
  from { opacity: 0.15; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@media (max-width: 560px) {
  .mark { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  .veil {
    background:
      linear-gradient(to top, rgba(3, 8, 23, 0.9) 0%, rgba(3, 8, 23, 0.55) 34%, rgba(3, 8, 23, 0) 62%);
  }
  .credit { left: 16px; right: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
  .btn, .btn svg { transition: none; }
}
</style>

        var f = (depth + k / steps) / S.depth;
        seg(x, y, nx, ny, 0.35 + f * 0.4, t0 + f * 0.5, 1 - f * 0.2, tree.alpha * (1 - f * 0.35));
        x = nx; y = ny;
      }
      if (depth < S.depth) {
        var a = S.spread * rr(0.75, 1.25), l = len * S.ratio * rr(0.85, 1.1);
        tree.q.push([x, y, ang - a, l, depth + 1]);
        tree.q.push([x, y, ang + a, l, depth + 1]);
        if (R() < 0.15) tree.q.push([x, y, ang + rr(-0.1, 0.1), l, depth + 1]);
      } else if (R() < 0.12) {
        PV.push(x, y, 0.6, t0 + 0.55, R() * 6.283, rr(1, 1.8));
      }
    }
    for (var t = 0; t < S.trees && mainSegs.length; t++) {
      var m = mainSegs[(R() * mainSegs.length) | 0], u = R();
      var sx = m[0] + (m[2] - m[0]) * u, sy = m[1] + (m[3] - m[1]) * u;
      if (sdAt(sx, sy) > -2) continue;
      var dir = Math.atan2(m[3] - m[1], m[2] - m[0]) + (R() < 0.5 ? 0 : Math.PI);
      var tr = { alpha: rr(0.7, 1.0), left: Math.round(42000 / S.trees), q: [] };
      var t0 = rr(0.15, 0.45);
      tr.q.push([sx, sy, dir, rr(20, 40), 0], [sx, sy, dir + Math.PI, rr(20, 40), 0]);
      for (var qj = 0; qj < tr.q.length && tr.left > 0; qj++) {
        var c = tr.q[qj]; creep(c[0], c[1], c[2], c[3], c[4], t0, tr);
      }
    }

    var look = { spacing: rr(11, 17), warp: rr(18, 42), seed: [rr(0, 90), rr(0, 90)] };

    // signed distance → RG 16-bit texture (sampled manually, bilinear in shader)
    var texPx = new Uint8Array(GN * 4);
    for (var ti = 0; ti < GN; ti++) {
      var tv = Math.max(0, Math.min(65535, Math.round((Math.max(-400, Math.min(1640, SD[ti])) + 400) * 32)));
      texPx[ti * 4] = tv >> 8; texPx[ti * 4 + 1] = tv & 255; texPx[ti * 4 + 3] = 255;
    }
    return { lines: new Float32Array(LV), points: new Float32Array(PV), tex: texPx, GW: GW, GH: GH, CELL: CELL, look: look };

  }

  // ---------- WebGL ----------
  function compile(type, src) {
    var sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function program(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) { var name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p: p, u: u };
  }
  var hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  var PREC = hp && hp.precision > 0 ? "highp" : "mediump";

  var PALETTE =
    "const vec3 DEEP=vec3(0.012,0.031,0.090);" +
    "const vec3 MIDNIGHT=vec3(0.035,0.075,0.175);" +
    "const vec3 PATINA=vec3(0.435,0.659,0.596);" +
    "const vec3 PATINA_HI=vec3(0.62,0.82,0.74);" +
    "const vec3 BRONZE=vec3(0.725,0.553,0.333);" +
    "const vec3 BRONZE_DK=vec3(0.46,0.32,0.19);";

  var bg = program(
    "attribute vec2 aP; void main(){ gl_Position=vec4(aP,0.0,1.0); }",
    "precision " + PREC + " float;" + PALETTE +
    "uniform sampler2D uDist; uniform vec2 uGrid; uniform float uCell;" +
    "uniform vec2 uRes; uniform vec2 uOff; uniform float uScale;" +
    "uniform float uTime; uniform float uReveal; uniform float uSpacing; uniform float uWarp; uniform vec2 uSeed;" +
    "float dec(vec2 ij){ vec4 t=texture2D(uDist,(ij+0.5)/uGrid); return (floor(t.r*255.0+0.5)*256.0+floor(t.g*255.0+0.5))/32.0-400.0; }" +
    "float sdf(vec2 p){ vec2 g=p/uCell; g=clamp(g,vec2(0.0),uGrid-1.001); vec2 i=floor(g); vec2 f=g-i;" +
    "  return mix(mix(dec(i),dec(i+vec2(1.0,0.0)),f.x),mix(dec(i+vec2(0.0,1.0)),dec(i+vec2(1.0,1.0)),f.x),f.y); }" +
    "float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }" +
    "float noise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);" +
    "  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y); }" +
    "float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+vec2(17.1,9.2); a*=0.5; } return v; }" +
    "void main(){" +
    "  vec2 px=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);" +
    "  vec2 p=(px-uOff)/uScale;" +
    "  float sd=sdf(p);" +
    "  float n=fbm(p*0.0055+uSeed);" +
    "  float n2=fbm(p*0.016+uSeed*1.7+vec2(uTime*0.012,-uTime*0.009));" +
    "  vec2 q=px/uRes;" +
    "  vec3 col=mix(MIDNIGHT,DEEP,clamp(length(q-vec2(0.62,0.38))*1.15,0.0,1.0));" +
    "  float sea=smoothstep(-1.0,1.0,sd);" +
    "  col=mix(col*0.82+BRONZE_DK*0.025,col,sea);" +
    "  col+=PATINA*0.045*exp(-max(sd,0.0)/22.0)*sea*(0.7+0.3*sin(uTime*0.21));" +
    "  float tide=sin(uTime*0.06)*0.55;" +
    "  float ph=(sd+(n-0.5)*uWarp+(n2-0.5)*uWarp*0.4)/uSpacing-uTime*0.03+tide;" +
    "  float d=abs(fract(ph+0.5)-0.5);" +
    "  float lw=1.1/(uScale*uSpacing);" +
    "  float ln=1.0-smoothstep(lw*0.4,lw*1.4,d);" +
    "  float major=1.0-step(0.5,mod(floor(ph+0.5),4.0));" +
    "  vec3 lc=mix(PATINA,BRONZE,smoothstep(0.38,0.72,n));" +
    "  lc=mix(lc,BRONZE,major*0.55);" +
    "  float fall=exp(-max(sd,0.0)/260.0)*0.8+0.2;" +
    "  float rv=smoothstep(uReveal*620.0+40.0,uReveal*620.0-20.0,abs(sd));" +
    "  float amp=mix(0.06,(0.17+0.2*major)*fall,sea);" +
    "  col+=lc*ln*amp*rv;" +
    "  float e=abs(sd)*uScale;" +
    "  col+=PATINA_HI*(exp(-e*e/1.6)*0.42+exp(-e/9.0)*0.035)*smoothstep(0.0,0.25,uReveal);" +
    "  col+=(hash(px+fract(uTime))-0.5)*0.012;" +
    "  gl_FragColor=vec4(col,1.0);" +
    "}"
  );

  var lineVS =
    "attribute vec2 aPos; attribute vec4 aA;" +
    "uniform vec2 uRes; uniform vec2 uOff; uniform float uScale; uniform float uTime; uniform float uReveal; uniform float uAmp; uniform vec2 uNudge; uniform mediump float uPt;" +
    "varying float vA; varying float vH;" +
    "void main(){" +
    "  vec2 p=aPos; float w=aA.x;" +
    "  vec2 sw=vec2(sin(p.y*0.011+uTime*0.42)+0.5*sin(p.x*0.023-uTime*0.29), cos(p.x*0.009+uTime*0.36)+0.5*cos(p.y*0.019+uTime*0.25));" +
    "  p+=sw*w*uAmp;" +
    "  vec2 px=p*uScale+uOff+uNudge;" +
    "  vec2 c=px/uRes*2.0-1.0; gl_Position=vec4(c.x,-c.y,0.0,1.0);" +
    "  float r=smoothstep(aA.y,aA.y+0.07,uReveal);" +
    "  if(uPt>0.5){ float tw=0.55+0.45*sin(uTime*(0.7+fract(aA.z*3.1)*0.9)+aA.z); vA=r*tw; vH=2.0; gl_PointSize=aA.w*uPt; }" +
    "  else { vA=aA.w*r; vH=aA.z; gl_PointSize=1.0; }" +
    "}";
  var lineFS =
    "precision mediump float;" + PALETTE +
    "uniform mediump float uPt; varying float vA; varying float vH;" +
    "void main(){" +
    "  vec3 c=mix(PATINA,BRONZE,clamp(vH,0.0,1.0));" +
    "  float a=vA;" +
    "  if(uPt>0.5){ vec2 d=gl_PointCoord-0.5; float r=length(d); a*=smoothstep(0.5,0.0,r); c=mix(vec3(1.0),PATINA_HI,0.25); }" +
    "  gl_FragColor=vec4(c*a,a);" +
    "}";
  var lines = program(lineVS, lineFS);

  // fullscreen triangle
  var quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  var lineBuf = gl.createBuffer(), ptBuf = gl.createBuffer(), tex = gl.createTexture();
  var lineCount = 0, ptCount = 0, GW = 1, GH = 1, CELL = 3, look = null;
  function upload(g) {
    gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
    gl.bufferData(gl.ARRAY_BUFFER, g.lines, gl.STATIC_DRAW);
    lineCount = g.lines.length / 6;
    gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
    gl.bufferData(gl.ARRAY_BUFFER, g.points, gl.STATIC_DRAW);
    ptCount = g.points.length / 6;
    GW = g.GW; GH = g.GH; CELL = g.CELL; look = g.look;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GW, GH, 0, gl.RGBA, gl.UNSIGNED_BYTE, g.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  // ---------- view: cover the viewport, keep Portsea Island in frame ----------
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    var dpr = soft ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    if (W * H * dpr * dpr > 3.4e6) dpr = Math.sqrt(3.4e6 / (W * H));
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    var portrait = H > W * 1.05;
    var s = Math.max(W / DW, H / DH) * (portrait ? 1.0 : 1.02);
    var fx = portrait ? 870 : 760, fy = portrait ? 820 : 780;
    var ox = W / 2 - fx * s, oy = H / 2 - fy * s;
    ox = Math.min(0, Math.max(W - DW * s, ox)); oy = Math.min(0, Math.max(H - DH * s, oy));
    view = { scale: s * dpr, ox: ox * dpr, oy: oy * dpr, dpr: dpr };
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function bindLines(buf) {
    var aPos = gl.getAttribLocation(lines.p, "aPos"), aA = gl.getAttribLocation(lines.p, "aA");
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(aA); gl.vertexAttribPointer(aA, 4, gl.FLOAT, false, 24, 8);
  }

  function draw(time, reveal) {
    var W = canvas.width, H = canvas.height;
    gl.disable(gl.BLEND);
    gl.useProgram(bg.p);
    var aP = gl.getAttribLocation(bg.p, "aP");
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(bg.u.uDist, 0);
    gl.uniform2f(bg.u.uGrid, GW, GH); gl.uniform1f(bg.u.uCell, CELL);
    gl.uniform2f(bg.u.uRes, W, H); gl.uniform2f(bg.u.uOff, view.ox, view.oy); gl.uniform1f(bg.u.uScale, view.scale);
    gl.uniform1f(bg.u.uTime, time); gl.uniform1f(bg.u.uReveal, reveal);
    gl.uniform1f(bg.u.uSpacing, look.spacing); gl.uniform1f(bg.u.uWarp, look.warp);
    gl.uniform2f(bg.u.uSeed, look.seed[0], look.seed[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(aP);

    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(lines.p);
    gl.uniform2f(lines.u.uRes, W, H); gl.uniform2f(lines.u.uOff, view.ox, view.oy); gl.uniform1f(lines.u.uScale, view.scale);
    gl.uniform1f(lines.u.uTime, time); gl.uniform1f(lines.u.uReveal, reveal); gl.uniform1f(lines.u.uAmp, 3.2);
    gl.uniform1f(lines.u.uPt, 0);
    bindLines(lineBuf);
    gl.uniform2f(lines.u.uNudge, 0, 0);
    gl.drawArrays(gl.LINES, 0, lineCount);
    if (view.dpr > 1.3) { // a second, offset pass keeps hairlines visible on dense screens
      gl.uniform2f(lines.u.uNudge, 0.7, 0.7);
      gl.drawArrays(gl.LINES, 0, lineCount);
    }
    if (ptCount) {
      gl.uniform1f(lines.u.uPt, view.dpr * 1.6);
      gl.uniform2f(lines.u.uNudge, 0, 0);
      bindLines(ptBuf);
      gl.drawArrays(gl.POINTS, 0, ptCount);
    }
  }

  // Without a GPU (software WebGL) every animated frame would run on the CPU: draw one still frame instead.
  var soft = (function () {
    var info = gl.getExtension("WEBGL_debug_renderer_info");
    var name = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || "");
    return /swiftshader|llvmpipe|softpipe|software|basic render/i.test(name);
  })();
  var still = soft || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var ready = false, start = 0;

  function begin(g) {
    upload(g);
    layout();
    ready = true;
    canvas.classList.add("on");
    if (still) { draw(40, 1); return; }
    start = performance.now();
    requestAnimationFrame(function frame(now) {
      var t = (now - start) / 1000;
      var r = Math.min(1, t / 6.5); r = 1 - Math.pow(1 - r, 2.2);
      draw(t + 40, r);
      requestAnimationFrame(frame);
    });
  }
  window.addEventListener("resize", function () { if (!ready) return; layout(); if (still) draw(40, 1); });

  var seedArr = new Uint32Array(1);
  (window.crypto || window.msCrypto).getRandomValues(seedArr);
  var seed = seedArr[0];
  try {
    var src = "var generate = " + generate.toString() + ";\n" +
      "onmessage = function (e) { var g = generate(e.data.map, e.data.seed);" +
      " postMessage(g, [g.lines.buffer, g.points.buffer, g.tex.buffer]); };";
    var url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    var worker = new Worker(url);
    worker.onmessage = function (e) { begin(e.data); worker.terminate(); URL.revokeObjectURL(url); };
    worker.onerror = function () { worker.terminate(); setTimeout(function () { begin(generate(MAP, seed)); }, 0); };
    worker.postMessage({ map: MAP, seed: seed });
  } catch (err) {
    setTimeout(function () { begin(generate(MAP, seed)); }, 0);
  }
})();
</script>
</body>
</html>
